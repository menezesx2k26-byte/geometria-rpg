name: Apply adaptive V4 update

on:
  push:
    branches:
      - agent/adaptive-v4-update
    paths:
      - '.github/workflows/apply-adaptive-v4.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore V4 payload
        shell: bash
        run: |
          cat .v4-payload/part-* > /tmp/update.b64
          base64 --decode /tmp/update.b64 > /tmp/update.tar.gz
          echo '5e0e168f66161a6ef34d7f69fb78394e04584bb7dcf084b7141a37bf5b49b3b1  /tmp/update.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/update.tar.gz -C .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Commit validated V4
        shell: bash
        run: |
          rm -rf .v4-payload
          rm -f .github/workflows/apply-adaptive-v4.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add adaptive competency engine v4'
          git push origin HEAD:agent/adaptive-v4-update
