name: Retry Cloudflare Pages V4 deploy

on:
  push:
    branches:
      - agent/adaptive-v4-update
    paths:
      - .github/workflows/deploy-cloudflare-v4-retry.yml

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          STATUS_FILE=.cloudflare-deploy-status.txt
          : > "$STATUS_FILE"

          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "status=missing_credentials" >> "$STATUS_FILE"
            echo "commit=aa044c7001f7c73858e5dc1a2f3aaf6d33b0cfeb" >> "$STATUS_FILE"
          else
            OUTPUT=$(npx wrangler pages deploy dist \
              --project-name=geometria-rpg \
              --branch=v2-gamified-path \
              --commit-hash=aa044c7001f7c73858e5dc1a2f3aaf6d33b0cfeb \
              --commit-message='feat: adaptive competency engine v4' 2>&1)
            CODE=$?
            if [ "$CODE" -eq 0 ]; then
              echo "status=success" >> "$STATUS_FILE"
            else
              echo "status=failed" >> "$STATUS_FILE"
            fi
            echo "exit_code=$CODE" >> "$STATUS_FILE"
            echo "commit=aa044c7001f7c73858e5dc1a2f3aaf6d33b0cfeb" >> "$STATUS_FILE"
            printf '%s\n' "$OUTPUT" >> "$STATUS_FILE"
          fi

      - name: Persist result and self-clean
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/deploy-cloudflare-v4-retry.yml
          if [ ! -f .cloudflare-deploy-status.txt ]; then
            echo "status=workflow_failed_before_deploy" > .cloudflare-deploy-status.txt
            echo "commit=aa044c7001f7c73858e5dc1a2f3aaf6d33b0cfeb" >> .cloudflare-deploy-status.txt
          fi
          git add -A
          git commit -m "ci: record Cloudflare deploy retry" || true
          git push
