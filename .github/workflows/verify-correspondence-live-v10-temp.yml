name: Verify Correspondence Live V10

on:
  pull_request:
    branches:
      - codex/v2-gamified-path
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 257bca437616da74ece1ce4bbaf0bd89
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v2-gamified-path
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy current V10 build
        run: npx wrangler@4 deploy
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify correspondence UX on live Worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const base = 'https://geometria-rpg.menezesx2k26.workers.dev';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const page = await context.newPage();
          const response = await page.goto(base + '/encounter/ordered-correspondence', { waitUntil: 'networkidle' });
          if (!response?.ok()) throw new Error(`HTTP ${response?.status()}`);

          if (!(await page.getByText('△ABC ≅ △DEF', { exact: true }).isVisible())) throw new Error('Congruence datum is not visible');
          if (await page.getByText(/Registrar A↔D, B↔E e C↔F na ordem correta/).count()) throw new Error('Answer still leaks in objective');
          if ((await page.locator('.tick-mark').count()) !== 0) throw new Error('Correspondence marks still leak answers');

          const palette = page.getByLabel('Objetos selecionáveis');
          if ((await palette.getByRole('button').count()) !== 6) throw new Error('Vertex stage must expose exactly 6 targets');
          if (await palette.getByRole('button', { name: 'AB', exact: true }).count()) throw new Error('Side targets leaked into vertex stage');

          const confirm = page.getByRole('button', { name: 'Confirmar aplicação', exact: true });
          if (!(await confirm.isDisabled())) throw new Error('Confirm must start disabled');

          for (const label of ['D','A','F','C','E','B']) await palette.getByRole('button', { name: label, exact: true }).click();
          const expectedBadges = { A: '1', D: '1', F: '2', C: '2', E: '3', B: '3' };
          for (const [label, expected] of Object.entries(expectedBadges)) {
            const badge = await palette.getByRole('button', { name: label, exact: true }).locator('span').textContent();
            if (badge !== expected) throw new Error(`Badge for ${label}: expected ${expected}, got ${badge}`);
          }
          if (!(await page.getByText(/Par 1: D ↔ A/).isVisible())) throw new Error('Pair summary missing');
          if (!(await confirm.isEnabled())) throw new Error('Confirm must enable after 3 complete pairs');
          await confirm.click();

          if ((await palette.getByRole('button').count()) !== 6) throw new Error('Side stage must expose exactly 6 targets');
          if (await palette.getByRole('button', { name: 'A', exact: true }).count()) throw new Error('Vertex targets leaked into side stage');
          for (const label of ['DE','AB','EF','BC','DF','AC']) await palette.getByRole('button', { name: label, exact: true }).click();
          await confirm.click();

          if ((await palette.getByRole('button').count()) !== 6) throw new Error('Angle stage must expose exactly 6 targets');
          for (const label of ['∠D','∠A','∠F','∠C','∠E','∠B']) await palette.getByRole('button', { name: label, exact: true }).click();
          await confirm.click();
          if (!(await page.getByText(/O argumento completo/).isVisible())) throw new Error('Encounter did not complete with equivalent pair ordering');

          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
          if (overflow > 1) throw new Error(`Horizontal overflow ${overflow}px`);

          await browser.close();
          console.log('LIVE_CORRESPONDENCE_V10_OK');
          NODE
