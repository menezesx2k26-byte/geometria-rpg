name: Verify Didactic Practice Live V9

on:
  pull_request:
    branches:
      - codex/v2-gamified-path
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 257bca437616da74ece1ce4bbaf0bd89
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v2-gamified-path
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy current V9 build
        run: npx wrangler@4 deploy
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify concrete guided practice live
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const base = 'https://geometria-rpg.menezesx2k26.workers.dev';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const page = await context.newPage();

          const checks = [
            ['/lesson/opv-lal-foundations', 'BC≅EF, se B↔E e C↔F'],
            ['/lesson/proof-tools', 'AD≅AD por reflexividade'],
            ['/lesson/ala-foundations', 'São iguais, pois os três pares de lados correspondentes têm as mesmas medidas'],
            ['/lesson/cevian-foundations', 'D∈BC e BD≅DC'],
            ['/lesson/parallelism-foundations', 'Alternos internos'],
            ['/lesson/cartesian-foundations', 'x=2 é horizontal e y=−3 é vertical'],
            ['/lesson/coordinate-bridge', 'Os três pontos são colineares'],
            ['/lesson/line-system-foundations', 'É uma reta formada por todos os pares (x,y) que satisfazem a equação'],
            ['/lesson/line-system-foundations', 'x=3 é vertical e y=1 é horizontal'],
            ['/lesson/line-system-foundations', 'Calcular o ponto médio M de BC e construir a reta AM'],
            ['/lesson/distance-modeling-foundations', 'dados → pontos auxiliares → retas/sistemas → grandeza da tese'],
            ['/lesson/distance-modeling-foundations', '2√5/3 = 2·(√5/3), portanto PB=2PN'],
          ];

          for (const [route, label] of checks) {
            const response = await page.goto(base + route, { waitUntil: 'networkidle' });
            if (!response?.ok()) throw new Error(`${route}: HTTP ${response?.status()}`);
            if (!(await page.getByRole('button', { name: label, exact: true }).isVisible())) {
              throw new Error(`${route}: guided check '${label}' not visible`);
            }
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
            if (overflow > 1) throw new Error(`${route}: horizontal overflow ${overflow}px`);
          }

          await page.goto(base + '/lesson/opv-lal-foundations', { waitUntil: 'networkidle' });
          await page.getByRole('button', { name: 'BC≅EF é o próprio critério LAL', exact: true }).click();
          const stored = await page.evaluate(() => JSON.parse(localStorage.getItem('geometria-rpg:progress:v4') ?? '{}'));
          if ((stored.attempts?.length ?? 0) !== 0) throw new Error('Guided-practice mistake created legacy attempt evidence');
          if ((stored.attemptsV4?.length ?? 0) !== 0) throw new Error('Guided-practice mistake created V4 attempt evidence');
          if (!Object.values(stored.competencyStates ?? {}).every((state) => state.evidenceCount === 0)) {
            throw new Error('Guided-practice mistake changed competency mastery evidence');
          }

          await browser.close();
          console.log('LIVE_DIDACTIC_PRACTICE_V9_OK');
          NODE
