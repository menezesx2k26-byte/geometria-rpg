name: Run Semantic Answer Audit

on:
  pull_request:
    branches:
      - codex/v2-gamified-path
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/semantic-answer-acceptance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and apply prepared patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/semantic-answer-audit.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install and validate"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('Could not locate prepared patch block')
          code = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          code = textwrap.dedent(code)
          Path('/tmp/semantic_patch.py').write_text(code, encoding='utf-8')
          PY
          python3 /tmp/semantic_patch.py

      - name: Full QA
        shell: bash
        run: |
          set +e
          LOG=.semantic-answer-validation.log
          STATUS=.semantic-answer-status.txt
          : > "$LOG"
          npm ci >> "$LOG" 2>&1; CI=$?
          LINT=125; UNIT=125; BUILD=125; PW=125; E2E=125
          if [ "$CI" -eq 0 ]; then
            npm run lint >> "$LOG" 2>&1; LINT=$?
            npm run test >> "$LOG" 2>&1; UNIT=$?
            npm run build >> "$LOG" 2>&1; BUILD=$?
            npx playwright install --with-deps chromium >> "$LOG" 2>&1; PW=$?
            if [ "$BUILD" -eq 0 ] && [ "$PW" -eq 0 ]; then npm run test:e2e >> "$LOG" 2>&1; E2E=$?; fi
          fi
          RESULT=success
          for CODE in "$CI" "$LINT" "$UNIT" "$BUILD" "$PW" "$E2E"; do if [ "$CODE" -ne 0 ]; then RESULT=failed; fi; done
          printf 'status=%s\nnpm_ci=%s\nlint=%s\nunit=%s\nbuild=%s\nplaywright_install=%s\ne2e=%s\n' "$RESULT" "$CI" "$LINT" "$UNIT" "$BUILD" "$PW" "$E2E" > "$STATUS"
          cat "$STATUS"

      - name: Persist semantic branch result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if grep -q '^status=success$' .semantic-answer-status.txt; then
            rm -f .semantic-answer-trigger .semantic-answer-status.txt .semantic-answer-validation.log .github/workflows/semantic-answer-audit.yml
            git add -A
            git commit -m 'fix: accept mathematically equivalent answers'
            git push origin HEAD:agent/semantic-answer-acceptance
          else
            rm -f .semantic-answer-trigger
            git add -A
            git commit -m 'wip: semantic answer audit needs fixes' || true
            git push origin HEAD:agent/semantic-answer-acceptance
            exit 1
          fi
