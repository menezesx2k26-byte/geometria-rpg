name: Patch Didactic E2E V8

on:
  push:
    branches:
      - agent/didactic-sequence-v8

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[e2e-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/didactic-sequence-v8
      - name: Align E2E with teach-before-assess flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/e2e/app.spec.ts')
          text = path.read_text()

          due_old = "await expect(page.getByRole('link', { name: /Continuar jornada.*A Ordem dos Vértices/ })).toBeVisible();"
          due_new = "await expect(page.getByRole('link', { name: /Continuar jornada.*Antes da Congruência/ })).toBeVisible();"
          # Only the first occurrence belongs to the due-review test.
          text = text.replace(due_old, due_new, 1)

          replacement = r'''test('single path teaches before assessing correspondence and keeps first-contact errors non-punitive', async ({ page }) => {
            await resetProgress(page);
            await page.goto('/map');
            await expect(page.getByRole('link', { name: /Continuar jornada.*Antes da Congruência/ })).toBeVisible();
            await page.getByRole('link', { name: /Continuar jornada.*Antes da Congruência/ }).click();

            await expect(page.getByRole('heading', { name: 'Antes da Congruência' })).toBeVisible();
            await page.getByRole('button', { name: 'Depende de como os triângulos estão desenhados', exact: true }).click();
            await expect(page.getByText(/orientação visual não altera/i)).toBeVisible();

            const beforeCorrection = await page.evaluate(() => JSON.parse(localStorage.getItem('geometria-rpg:progress:v4') ?? '{}'));
            expect(beforeCorrection.attempts).toHaveLength(0);
            expect(beforeCorrection.attemptsV4).toHaveLength(0);
            expect(Object.values(beforeCorrection.competencyStates).every((state) => (state as { evidenceCount: number }).evidenceCount === 0)).toBe(true);

            await page.getByRole('button', { name: 'A↔D, B↔E, C↔F', exact: true }).click();
            await page.getByRole('button', { name: 'Concluir ponte didática', exact: true }).click();

            await expect(page.getByRole('link', { name: /Continuar jornada.*A Ordem dos Vértices/ })).toBeVisible();
            await page.getByRole('link', { name: /Continuar jornada.*A Ordem dos Vértices/ }).click();
            await page.getByRole('button', { name: /Continuar/ }).click();
            await page.getByRole('button', { name: /Continuar/ }).click();
            for (const answer of ['E', 'F', 'DE', '∠F']) {
              await page.getByRole('button', { name: answer, exact: true }).click();
              await page.getByRole('button', { name: 'Verificar resposta', exact: true }).click();
              await page.getByRole('button', { name: /Continuar/ }).click();
            }
            await page.getByRole('button', { name: /Continuar/ }).click();
            await page.getByRole('link', { name: /Iniciar desafio/ }).click();
            await applyEncounterRule(page, 'Congruência', ['A', 'D', 'B', 'E', 'C', 'F']);
            await applyEncounterRule(page, 'Congruência', ['AB', 'DE', 'BC', 'EF', 'AC', 'DF']);
            await applyEncounterRule(page, 'Congruência', ['∠A', '∠D', '∠B', '∠E', '∠C', '∠F']);
            await expect(page.getByRole('heading', { name: 'Conhecimento conquistado' })).toBeVisible();
            await page.getByRole('link', { name: /Continuar jornada/ }).click();
            await expect(page.getByRole('link', { name: /Continuar jornada.*OPV, LAL e Consequência/ })).toBeVisible();
          });

          test('primary navigation exposes only path, profile and achievements' '''

          pattern = re.compile(
              r"test\('single path teaches correspondence before the challenge and grants a visible reward'.*?\n\}\);\n\ntest\('primary navigation exposes only path, profile and achievements'",
              re.S,
          )
          if not pattern.search(text):
              raise SystemExit('Single-path E2E block not found')
          text = pattern.sub(replacement, text, count=1)
          # replacement intentionally carries the next test prefix; restore its callback suffix already in source.
          path.write_text(text)
          PY
      - name: Verify TypeScript test syntax marker
        run: grep -n "single path teaches before assessing" tests/e2e/app.spec.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/app.spec.ts
          git commit -m "test: align E2E with didactic bridges [e2e-patched]"
          git push origin HEAD:agent/didactic-sequence-v8
