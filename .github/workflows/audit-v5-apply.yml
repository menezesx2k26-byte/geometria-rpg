name: Audit V5 Apply and Validate

on:
  push:
    branches:
      - agent/full-audit-v5
    paths:
      - '.audit-v5-trigger'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat .audit-v5-patch/part-* | base64 -d > /tmp/audit-v5.patch.gz
          echo '919220d7f4e25fd2f72b285c6055ced16a7b7383bb066033e55ee301f8c86cf1  /tmp/audit-v5.patch.gz' | sha256sum -c -
          gzip -dc /tmp/audit-v5.patch.gz > /tmp/audit-v5.patch
          python3 - <<'PY'
          import re
          from pathlib import Path
          src = Path('/tmp/audit-v5.patch').read_text(encoding='utf-8')
          chunks = re.split(r'(?=^--- )', src, flags=re.MULTILINE)
          out = []
          for chunk in chunks:
              if '+++ b/src/components/encounter/GeometryFigure.tsx' in chunk:
                  continue
              out.append(chunk)
          Path('/tmp/audit-v5-filtered.patch').write_text(''.join(out), encoding='utf-8')
          PY
          git apply --check /tmp/audit-v5-filtered.patch
          git apply /tmp/audit-v5-filtered.patch
          rm -rf .audit-v5-patch .audit-v5-payload .audit-v5-trigger .github/workflows/audit-v5-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: full structural, geometry and UX audit'
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run complete validation matrix
        id: validate
        shell: bash
        run: |
          set +e
          LOG=.audit-v5-validation.log
          STATUS=.audit-v5-status.txt
          : > "$LOG"

          echo '=== npm ci ===' >> "$LOG"
          npm ci >> "$LOG" 2>&1
          CI=$?

          LINT=125
          UNIT=125
          BUILD=125
          PW=125
          E2E=125

          if [ "$CI" -eq 0 ]; then
            echo '=== lint ===' >> "$LOG"
            npm run lint >> "$LOG" 2>&1
            LINT=$?

            echo '=== unit tests ===' >> "$LOG"
            npm run test >> "$LOG" 2>&1
            UNIT=$?

            echo '=== build ===' >> "$LOG"
            npm run build >> "$LOG" 2>&1
            BUILD=$?

            echo '=== playwright chromium install ===' >> "$LOG"
            npx playwright install --with-deps chromium >> "$LOG" 2>&1
            PW=$?

            if [ "$BUILD" -eq 0 ] && [ "$PW" -eq 0 ]; then
              echo '=== e2e ===' >> "$LOG"
              npm run test:e2e >> "$LOG" 2>&1
              E2E=$?
            fi
          fi

          RESULT=success
          for CODE in "$CI" "$LINT" "$UNIT" "$BUILD" "$PW" "$E2E"; do
            if [ "$CODE" -ne 0 ]; then RESULT=failed; fi
          done

          {
            echo "status=$RESULT"
            echo "npm_ci=$CI"
            echo "lint=$LINT"
            echo "unit=$UNIT"
            echo "build=$BUILD"
            echo "playwright_install=$PW"
            echo "e2e=$E2E"
            echo "source_commit=$(git rev-parse HEAD)"
          } > "$STATUS"
          cat "$STATUS"
          exit 0

      - name: Persist validation result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .audit-v5-status.txt .audit-v5-validation.log
          git commit -m 'ci: record audit v5 validation' || true
          git push

      - name: Enforce green audit
        shell: bash
        run: |
          grep -q '^status=success$' .audit-v5-status.txt
