name: Verify Correspondence V12 Live

on:
  pull_request:
    branches:
      - codex/v2-gamified-path
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 257bca437616da74ece1ce4bbaf0bd89
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v2-gamified-path
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy current V12 build
        run: npx wrangler@4 deploy
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify two-set matcher on live Worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const base = 'https://geometria-rpg.menezesx2k26.workers.dev';
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const page = await context.newPage();
          const response = await page.goto(base + '/encounter/ordered-correspondence', { waitUntil: 'networkidle' });
          if (!response?.ok()) throw new Error(`HTTP ${response?.status()}`);

          const polygons = page.locator('.interactive-figure svg polygon');
          if ((await polygons.count()) !== 2) throw new Error('Expected two triangles');
          if ((await polygons.nth(1).getAttribute('points')) !== '360,340 470,70 580,340') throw new Error('Neutral geometry not restored');
          if ((await page.locator('.tick-mark').count()) !== 0) throw new Error('Answer marks leaked');

          const palette = page.getByLabel('Objetos selecionáveis');
          const columns = palette.locator(':scope > div');
          if ((await columns.count()) !== 2) throw new Error('Expected two matching columns');
          const left = columns.nth(0);
          const right = columns.nth(1);
          const leftLabels = await left.getByRole('button').allTextContents();
          const rightLabels = await right.getByRole('button').allTextContents();
          if (leftLabels.join(',') !== 'A,B,C') throw new Error(`Left set wrong: ${leftLabels}`);
          if (rightLabels.join(',') === 'D,E,F') throw new Error('Right set was not shuffled');
          if ([...rightLabels].sort().join(',') !== 'D,E,F') throw new Error(`Right set wrong: ${rightLabels}`);

          await left.getByRole('button', { name: 'A', exact: true }).click();
          if (!(await left.getByRole('button', { name: 'B', exact: true }).isDisabled())) throw new Error('Same-set continuation should be blocked');
          await right.getByRole('button', { name: 'D', exact: true }).click();
          if (!(await page.getByText(/Par 1: A ↔ D/).isVisible())) throw new Error('Pair was not registered');

          const overflow = await page.evaluate(() => document.documentElement.scrollWidth - document.documentElement.clientWidth);
          if (overflow > 1) throw new Error(`Horizontal overflow ${overflow}px`);
          await browser.close();
          console.log('LIVE_CORRESPONDENCE_V12_OK');
          NODE
