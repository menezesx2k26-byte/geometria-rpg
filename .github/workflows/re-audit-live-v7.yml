name: Re-audit Live V7

on:
  pull_request:
    branches:
      - codex/v2-gamified-path
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 257bca437616da74ece1ce4bbaf0bd89
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Deploy audited build
        run: npx wrangler@4 deploy
      - name: Verify public Worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://geometria-rpg.menezesx2k26.workers.dev';
          const routes = ['/', '/map', '/encounter/official-q15', '/microquest/correspondence-pairs'];
          let index = '';
          for (const route of routes) {
            const response = await fetch(base + route, { redirect: 'follow' });
            const body = await response.text();
            if (!response.ok) throw new Error(`${route}: HTTP ${response.status}`);
            if (!body.includes('id="root"')) throw new Error(`${route}: invalid SPA shell`);
            if (route === '/') index = body;
            console.log(`${route}: ${response.status}`);
          }
          const js = index.match(/src="([^"]+\.js)"/)?.[1];
          if (!js) throw new Error('No JS bundle found');
          const bundle = await fetch(new URL(js, base));
          const text = await bundle.text();
          if (!bundle.ok || text.length < 1000) throw new Error(`Bundle invalid: ${bundle.status}`);
          console.log(`bundle: ${bundle.status}, ${text.length} bytes`);
          NODE
