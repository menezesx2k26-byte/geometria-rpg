name: Re-audit V7

on:
  pull_request:
    branches:
      - codex/v2-gamified-path
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  audit-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: 257bca437616da74ece1ce4bbaf0bd89
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
      - name: Deploy current audited build
        run: npx wrangler@4 deploy
      - name: Smoke test live Worker routes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://geometria-rpg.menezesx2k26.workers.dev';
          const routes = ['/', '/map', '/encounter/official-q15', '/microquest/correspondence-pairs'];
          let rootHtml = '';
          for (const route of routes) {
            const response = await fetch(base + route, { redirect: 'follow' });
            const body = await response.text();
            if (!response.ok) throw new Error(`${route}: HTTP ${response.status}`);
            if (!body.includes('id="root"')) throw new Error(`${route}: SPA root not found`);
            if (route === '/') rootHtml = body;
            console.log(`${route}: ${response.status} (${body.length} bytes)`);
          }
          const assetMatch = rootHtml.match(/src="([^"]+\.js)"/);
          if (!assetMatch?.[1]) throw new Error('Built JS asset not referenced by index');
          const assetResponse = await fetch(new URL(assetMatch[1], base));
          const asset = await assetResponse.text();
          if (!assetResponse.ok || asset.length < 1000) throw new Error(`JS asset invalid: HTTP ${assetResponse.status}, ${asset.length} bytes`);
          console.log(`asset: ${assetResponse.status} (${asset.length} bytes)`);
          NODE
