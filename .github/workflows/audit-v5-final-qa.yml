name: Audit V5 Final QA

on:
  push:
    branches:
      - agent/full-audit-v5
    paths:
      - '.audit-v5-final-trigger'

permissions:
  contents: write

jobs:
  final-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update E2E harness for audited UX
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/app.spec.ts')
          src = path.read_text(encoding='utf-8')

          old = """async function resetProgress(page: Page) {
            await page.goto('/review');
            await page.getByRole('button', { name: /Reiniciar progresso/ }).click();
          }
          """
          new = """async function resetProgress(page: Page) {
            await page.goto('/review');
            await page.getByRole('button', { name: /Reiniciar progresso/ }).click();
            await page.getByRole('button', { name: 'Sim, reiniciar', exact: true }).click();
            await page.waitForFunction(() => {
              const raw = localStorage.getItem('geometria-rpg:progress:v4');
              if (!raw) return false;
              try {
                const stored = JSON.parse(raw);
                return Array.isArray(stored.attempts) && stored.attempts.length === 0;
              } catch {
                return false;
              }
            });
          }
          """
          if old not in src:
              raise SystemExit('resetProgress helper pattern not found')
          src = src.replace(old, new, 1)

          old = """    const stored = JSON.parse(localStorage.getItem(key) ?? '{}');
            stored.reviewSchedule['triangle-congruence'] = {
          """
          new = """    const stored = JSON.parse(localStorage.getItem(key) ?? '{}');
            stored.reviewSchedule ??= {};
            stored.reviewSchedule['triangle-congruence'] = {
          """
          if old not in src:
              raise SystemExit('reviewSchedule pattern not found')
          src = src.replace(old, new, 1)

          old = """  await page.goto('/mission/ordered-correspondence');
            const labels = page.locator('.interactive-figure svg text');
          """
          new = """  await page.goto('/mission/ordered-correspondence');
            await expect(page.locator('.interactive-figure svg')).toBeVisible();
            await expect(page.locator('.interactive-figure svg text').filter({ hasText: /^C$/ })).toBeVisible();
            await expect(page.locator('.interactive-figure svg text').filter({ hasText: /^E$/ })).toBeVisible();
            const labels = page.locator('.interactive-figure svg text');
          """
          if old not in src:
              raise SystemExit('mobile SVG wait pattern not found')
          src = src.replace(old, new, 1)

          path.write_text(src, encoding='utf-8')
          PY

          rm -f .audit-v5-final-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/e2e/app.spec.ts .audit-v5-final-trigger
          git commit -m 'test: align e2e harness with audited UX'
          git push

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run complete validation matrix
        shell: bash
        run: |
          set +e
          LOG=.audit-v5-final-validation.log
          STATUS=.audit-v5-final-status.txt
          : > "$LOG"

          npm ci >> "$LOG" 2>&1; CI=$?
          LINT=125; UNIT=125; BUILD=125; PW=125; E2E=125

          if [ "$CI" -eq 0 ]; then
            npm run lint >> "$LOG" 2>&1; LINT=$?
            npm run test >> "$LOG" 2>&1; UNIT=$?
            npm run build >> "$LOG" 2>&1; BUILD=$?
            npx playwright install --with-deps chromium >> "$LOG" 2>&1; PW=$?
            if [ "$BUILD" -eq 0 ] && [ "$PW" -eq 0 ]; then
              npm run test:e2e >> "$LOG" 2>&1; E2E=$?
            fi
          fi

          RESULT=success
          for CODE in "$CI" "$LINT" "$UNIT" "$BUILD" "$PW" "$E2E"; do
            if [ "$CODE" -ne 0 ]; then RESULT=failed; fi
          done
          {
            echo "status=$RESULT"
            echo "npm_ci=$CI"
            echo "lint=$LINT"
            echo "unit=$UNIT"
            echo "build=$BUILD"
            echo "playwright_install=$PW"
            echo "e2e=$E2E"
            echo "source_commit=$(git rev-parse HEAD)"
          } > "$STATUS"
          cat "$STATUS"
          exit 0

      - name: Persist final QA result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .audit-v5-final-status.txt .audit-v5-final-validation.log
          git commit -m 'ci: record audit v5 final qa' || true
          git push

      - name: Enforce green final QA
        shell: bash
        run: grep -q '^status=success$' .audit-v5-final-status.txt
