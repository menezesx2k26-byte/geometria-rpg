name: Re-audit E2E Fast V7

on:
  pull_request:
    branches:
      - codex/v2-gamified-path
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium only
        run: npx playwright install chromium
      - name: E2E regression suite
        run: npm run test:e2e
